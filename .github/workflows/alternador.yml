name: Alternador Snake/Pac-Man

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # ─────────────────────────── Clona & troca p/ branch output ────────────
    - name: Checkout repositório
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Buscar e trocar para a branch 'output'
      run: |
        git fetch origin output
        git checkout output || git checkout -b output

    # ─────────────────────────── 1 ▪ Detecta modo atual ────────────────────
    - name: Ler modo atual (snake ou pacman)
      id: mode
      run: |
        echo "$(cat mode.txt 2>/dev/null || echo snake)" > mode.txt
        echo "current=$(cat mode.txt)" >> "$GITHUB_OUTPUT"

    # ─────────────────────────── 2 ▪ S N A K E  ────────────────────────────
    - name: Gerar cor aleatória (Snake)
      if: steps.mode.outputs.current == 'snake'
      id: snakeColor
      run: |
        python3 -c '
        import random
        colors = ["#FFA500", "#00FFFF", "#32CD32", "#FF69B4", "#FFD700",
                  "#DC143C", "#4B0082", "#008080", "#800080", "#FF8C00",
                  "#98FF98", "#FF4500"]
        print(f"color={random.choice(colors)}")
        ' >> "$GITHUB_OUTPUT" # CORREÇÃO: Usando $GITHUB_OUTPUT

    - name: Gerar Snake
      if: steps.mode.outputs.current == 'snake'
      uses: Platane/snk@v3
      with:
        github_user_name: anaclat # Ou use ${{ github.repository_owner }}
        outputs: |
          dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=${{ steps.snakeColor.outputs.color }}

    # ─────────────────────────── 3 ▪ P A C - M A N ─────────────────────────
    - name: Gerar Pac-Man
      if: steps.mode.outputs.current == 'pacman'
      uses: Platane/snk@v3
      with:
        github_user_name: anaclat # Ou use ${{ github.repository_owner }}
        outputs: |
          dist/github-contribution-grid-pacman.svg?palette=github-dark&pacman=true

    # ─────────────────────────── Unifica Copiar para nome genérico ───────
    - name: Copiar Snake/Pac-Man para nome genérico
      run: |
        if [ "${{ steps.mode.outputs.current }}" == "snake" ]; then
          cp dist/github-contribution-grid-snake.svg github-contribution-grid.svg
        else
          cp dist/github-contribution-grid-pacman.svg github-contribution-grid.svg
        fi

    # ─────────────────────────── 4 ▪ Alterna modo p/ próxima execução ─────
    - name: Alternar o modo para próxima execução
      run: |
        next=$( [ "$(cat mode.txt)" = "snake" ] && echo pacman || echo snake )
        echo "$next" > mode.txt
        echo "next_mode=$next" >> "$GITHUB_ENV" # CORREÇÃO: Exportando para $GITHUB_ENV

    # ─────────────────────────── 5 ▪ Commit & push ─────────────────────────
    - name: Commit e Push para output
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Atualiza animação (${ env.next_mode^^ })" || echo "Nada para commitar" # CORREÇÃO: Acessando via ${{ env.next_mode }}
        git push origin output